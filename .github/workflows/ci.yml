name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build
        # NOTE: EASYORDERS_TOKEN is intentionally NOT passed to the build.
        # The live EO API ships products without a normalized `images` array, which crashes
        # the prerender. Until we have the documented EO API spec, the static catalog
        # fallback (lib/easyorders.ts → STATIC_PRODUCTS) is the source of truth at build time.
        # Live data can be re-wired in M3/M4 once the EO product schema is locked.
